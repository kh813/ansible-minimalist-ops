# ==============================================================================
# ansible-minimalist-ops インベントリ設定テンプレート
# ==============================================================================

[all:vars]
ansible_user=opsadmin
ansible_ssh_private_key_file=~/.ssh/ansible_manager_key
ansible_python_interpreter=/usr/bin/python3

# ==============================================================================
# フェーズ1: 稼働中 Linux サーバー（最優先）
# ==============================================================================
# --- Web / AP サーバー群 ---
# パラメータ説明:
# - drain_healthcheck_file: LBが監視するヘルスチェックファイル（一時退避でLBから安全に切り離し）
# - healthcheck_url: 検証用HTTPエンドポイント
# - healthcheck_expected_body: 期待するレスポンス本文のキーワード（例: ok や healthy）
# - target_services: 再起動後に稼働を確認すべき固有サービス一覧（JSON配列）
[linux_web]
# web01.corp.internal ansible_host=192.168.10.21 drain_healthcheck_file=/var/www/html/healthz healthcheck_url=http://192.168.10.21/health healthcheck_expected_body=ok target_services='["nginx"]'
# web02.corp.internal ansible_host=192.168.10.22 drain_healthcheck_file=/var/www/html/healthz healthcheck_url=http://192.168.10.22/health healthcheck_expected_body=ok target_services='["nginx"]'

# --- DB / バックエンドサーバー群 ---
# パラメータ説明:
# - db_check_port: 再起動復帰後に疎通確認する待受ポート番号
[linux_db]
# db01.corp.internal  ansible_host=192.168.10.31 db_check_port=5432 target_services='["postgresql"]'

# --- Linux グループ統合 ---
[linux_servers:children]
linux_web
linux_db

# ==============================================================================
# フェーズ2: Windows（次期展開・OpenSSH または WinRM）
# ==============================================================================
[windows_servers]
# 【推奨】Windows標準のOpenSSHサーバーを利用する場合（Linuxと鍵認証を共通化可能）
# win01.corp.internal ansible_host=192.168.20.101 ansible_user=opsadmin ansible_connection=ssh ansible_shell_type=powershell

# 【従来方式】WinRMを利用する場合
# win02.corp.internal ansible_host=192.168.20.102 ansible_user=Administrator ansible_connection=winrm ansible_port=5986 ansible_winrm_server_cert_validation=ignore

# ==============================================================================
# フェーズ3: macOS 端末（将来拡張・開発環境更新）
# ==============================================================================
[mac_clients]
# mac01.corp.internal ansible_host=192.168.20.51 ansible_user=admin_mac ansible_connection=ssh
